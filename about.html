<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT ME</title>
    <style>
        /* 1. 全域與字體設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0b0a;
            /* 100% 還原打字機極簡字體 */
            font-family: 'Courier New', Courier, monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #ffffff;
            overflow: hidden;
        }

        /* 2. 背景圖片佈局 (電腦版) */
        .collage-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* 滿版主背景：my01 */
        .bg-my01 {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%) brightness(45%);
            z-index: 1;
        }

        /* 疊加老照片：my03 */
        .bg-my03 {
            position: absolute;
            right: 8%;
            bottom: 8%;
            width: 32%;
            height: 55%;
            object-fit: cover;
            filter: grayscale(100%) contrast(130%) brightness(35%);
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 3. 文字圖層佈局 (電腦版) */
        .content-layer {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }

        /* 頂部介紹 */
        .header-intro {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .dossier-data {
            flex-grow: 1;
        }

        /* 內文與問號字體大小 */
        pre {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px; 
            line-height: 1.8;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* 🔥 調整 EDUCATION 和 INTERNSHIP 的字體大一點點 */
        .section-title {
            font-size: 13px; 
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* 左下角返回箭頭 */
        .back-link {
            position: fixed;
            bottom: 60px;
            left: 80px;
            z-index: 4;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #ffffff;
        }

        /* ===================================================
           📱 4. 核心修正：手機端（RWD 響應式變形防護）
           =================================================== */
        @media (max-width: 768px) {
            /* 縮小手機端四周留白，防止橫向空間不足導致文字強制換行換位 */
            .content-layer {
                padding: 40px 30px; 
            }
            
            .header-intro {
                font-size: 13px;
                margin-bottom: 40px;
            }

            /* 手機端大字體等比例微調，視覺更精緻 */
            .section-title {
                font-size: 15px; 
            }

            pre {
                font-size: 12px;
                line-height: 1.7;
            }

            /* 修正 my03 老照片在手機直向螢幕上的比例，防止它縮成一條細線 */
            .bg-my03 {
                width: 55%;
                height: 38%;
                right: 5%;
                bottom: 12%;
            }

            /* 確保手機端返回鍵的位置與上方文字左側完美對齊 */
            .back-link {
                bottom: 40px;
                left: 30px; 
            }
        }
    </style>
</head>
<body>

    <div class="collage-background">
        <img src="my01.jpg" class="bg-my01" alt="Background Core Eye">
        <img src="my03.jpg" class="bg-my03" alt="Background Layer Forest">
    </div>

    <div class="content-layer">
        
        <div class="header-intro">
            JOLINE CHU  08 HK
        </div>

        <div class="dossier-data">
<pre>
<span class="section-title">EDUCATION</span>
?

<span class="section-title">INTERNSHIP</span>
?
</pre>
        </div>

    </div>

    <a href="index.html" class="back-link">↖</a>

</body>
</html>
