<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLLECTIONS | JOL CHU</title>
    <style>
        /* 1. 全局設定：純黑底、打字機字體、無粗體 */
        body {
            margin: 0;
            padding: 0;
            background-color: #121110;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            font-weight: normal; /* 全局禁止粗體 */
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 2. 頂部導航：極簡、小字 */
        nav {
            padding: 50px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1rem;
            letter-spacing: 4px;
            text-decoration: none;
            color: #ffffff;
            opacity: 0.8;
        }

        .nav-back {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-decoration: none;
            color: rgba(213, 201, 185, 0.4);
            transition: color 0.3s;
        }

        .nav-back:hover {
            color: #ffffff;
        }

        /* 3. 頁面內容容器：縮小寬度以提升精緻感 */
        .section-container {
            max-width: 1100px; /* 限制整體寬度，防止圖片在寬螢幕過大 */
            margin: 0 auto;
            padding: 0 60px 100px 60px;
        }

        .category-title {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: rgba(213, 201, 185, 0.5);
            margin-bottom: 50px;
            display: flex;
            align-items: center;
        }

        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin-left: 20px;
        }

        /* 4. 攝影作品網格：增加間距，縮小圖片佔比 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* 縮小單張圖片最小寬度 */
            gap: 80px; /* 增加留白感 */
            margin-bottom: 100px;
        }

        .photo-item {
            position: relative;
            transition: opacity 0.4s ease;
        }

        .photo-item:hover {
            opacity: 0.8; /* 懸停時輕微變淡，代替濾鏡效果 */
        }

        .photo-item img {
            width: 100%;
            display: block;
            filter: none; /* 取消所有濾鏡，直接運用原圖 */
        }

        /* 作品說明文字 */
        .photo-info {
            padding: 15px 0;
            font-size: 0.6rem;
            color: rgba(213, 201, 185, 0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* 5. 📱 手機端自適應 */
        @media (max-width: 768px) {
            nav { padding: 40px 30px; }
            .section-container { padding: 0 30px 60px 30px; }
            .photo-grid {
                grid-template-columns: 1fr; /* 手機端單欄 */
                gap: 50px;
            }
            .nav-brand { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-brand">JOL CHU</a>
        <a href="index.html" class="nav-back">↖ RETURN TO CABINET</a>
    </nav>

    <main class="section-container">
        
        <!-- FILM SECTION -->
        <div class="category-title">FILM ARCHIVE</div>
        
        <div class="photo-grid">
            
            <!-- 作品 02 -->
            <div class="photo-item">
                <img src="collections/film02.jpg" alt="Archive 02">
                <div class="photo-info">INDEX_01 / PORTRA 160 / 2023 </div>
            </div>

            <!-- 作品 03 -->
            <div class="photo-item">
                <img src="collections/film03.jpg" alt="Archive 03">
                <div class="photo-info">INDEX_02 / PORTRA 160 / 2023 </div>
            </div>

            <!-- 作品 04 (修正原 94) -->
            <div class="photo-item">
                <img src="collections/film04.jpg" alt="Archive 04">
                <div class="photo-info">INDEX_03 / PORTRA 160 / 2023 </div>
            </div>

            <!-- 作品 05 -->
            <div class="photo-item">
                <img src="collections/film05.jpg" alt="Archive 05">
                <div class="photo-info">INDEX_04 / PORTRA 160 / 2023 </div>
            </div>

            <!-- 作品 07 (已跳過 06) -->
            <div class="photo-item">
                <img src="collections/film07.jpg" alt="Archive 07">
                <div class="photo-info">INDEX_05 / PORTRA 160 / 2023 </div>
            </div>

        </div>

        <!-- DIGITAL SECTION -->
        <div class="category-title">DIGITAL ARCHIVE</div>
        <div style="font-size: 0.6rem; color: rgba(213,201,185,0.15); letter-spacing: 2px; padding-left: 5px;">
            [ SYSTEM_STATUS: PENDING_UPDATE ]
        </div>

    </main>

    <footer style="padding: 80px 0; text-align: center; font-size: 0.55rem; color: rgba(213,201,185,0.1); letter-spacing: 3px;">
        © JOL CHU / ALL RIGHTS RESERVED
    </footer>

</body>
</html>
