<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLLECTIONS | JOL CHU</title>
    <style>
        /* 1. 全局設定：純黑底、打字機字體、無粗體 */
        body {
            margin: 0;
            padding: 0;
            background-color: #121110;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            font-weight: normal; /* 全局禁止粗體 */
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 2. 頂部導航：極簡、小字 */
        nav {
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .nav-brand {
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-decoration: none;
            color: #ffffff;
            opacity: 0.9;
        }

        .nav-back {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-decoration: none;
            color: rgba(213, 201, 185, 0.5);
            transition: color 0.3s;
        }

        .nav-back:hover {
            color: #ffffff;
        }

        /* 3. 頁面標題：保留在上方，縮小尺寸 */
        header {
            padding: 0 50px 50px 50px;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 5px;
            margin: 0;
            opacity: 0.8;
        }

        /* 4. 作品分區標題 */
        .section-container {
            padding: 0 50px 100px 50px;
        }

        .category-title {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: rgba(213, 201, 185, 0.6);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
        }

        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin-left: 20px;
        }

        /* 5. 攝影作品網格：高反差黑白質感 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 60px;
            margin-bottom: 80px;
        }

        .photo-item {
            position: relative;
            background-color: #0c0b0a;
        }

        .photo-item img {
            width: 100%;
            display: block;
            /* 預設維持高反差黑白/低飽和，鼠標懸停恢復 */
            filter: grayscale(100%) contrast(1.1) brightness(0.8);
            transition: all 0.6s ease;
        }

        .photo-item:hover img {
            filter: grayscale(0%) contrast(1) brightness(1);
        }

        /* 作品說明文字：Portra 160 2023 */
        .photo-info {
            padding: 15px 0;
            font-size: 0.65rem;
            color: rgba(213, 201, 185, 0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 6. 📱 手機端自適應 */
        @media (max-width: 768px) {
            nav { padding: 30px 30px; }
            header { padding: 0 30px 40px 30px; }
            .section-container { padding: 0 30px 60px 30px; }
            .photo-grid {
                grid-template-columns: 1fr; /* 手機端單欄排列，防止位移 */
                gap: 40px;
            }
            .nav-brand { font-size: 1rem; }
            header h1 { font-size: 1.1rem; }
            .photo-item img { filter: none; } /* 手機端取消濾鏡以保證流暢 */
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-brand">JOL CHU</a>
        <a href="index.html" class="nav-back">↖ RETURN TO CABINET</a>
    </nav>

    <header>
        <h1>COLLECTIONS</h1>
    </header>

    <main class="section-container">
        
        <!-- FILM SECTION -->
        <div class="category-title">FILM PHOTOGRAPHY / PORTRA 160</div>
        
        <div class="photo-grid">
            
            <!-- 作品 02 -->
            <div class="photo-item">
                <img src="collections/film02.jpg" alt="Portra 160 Work 02">
                <div class="photo-info">REF_02 / PORTRA 160 / 2023</div>
            </div>

            <!-- 作品 03 -->

            <!-- 作品 94 -->

            <!-- 作品 05 -->

            <!-- 作品 06 -->

        </div>

        <!-- DIGITAL SECTION (目前為空，保留位置) -->
        <div class="category-title">DIGITAL ARCHIVE</div>

    </main>

    <footer style="padding: 60px 0; text-align: center; font-size: 0.6rem; color: rgba(213,201,185,0.15); letter-spacing: 2px;">
        © JOL CHU / 2024-2026
    </footer>

</body>
</html>
