<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Archive</title>
    <style>
        /* 全局深色底，100% 打字機字體 */
        body {
            margin: 0;
            padding: 0;
            background-color: #121110;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. 頂部名字 (JOL CHU) - 縮小、無粗體 */
        .brand-signature {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 10;
            pointer-events: none;
        }
        .brand-signature h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem; /* 縮小尺寸 */
            margin: 0;
            letter-spacing: 4px;
            font-weight: normal; /* 移除粗體 */
            color: #ffffff;
            opacity: 0.9;
        }

        /* 點擊外圍復原的隱形背景遮罩 */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 文件夾櫃主容器 */
        .cabinet-wrapper {
            position: relative;
            width: 85vw;
            max-width: 850px;
            height: 580px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            margin-top: 40px;
        }

        /* 通用文件夾樣式 */
        .file-folder {
            position: absolute;
            height: 100%;
            width: 360px;
            border-radius: 4px 16px 16px 4px;
            box-shadow: -15px 10px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s, opacity 0.4s;
            cursor: pointer;
            overflow: hidden;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .folder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) contrast(1.2);
            transition: filter 0.5s;
        }
        
        .file-folder.pulled-out .folder-bg {
            filter: brightness(0.85) contrast(1.15);
        }

        /* 導入背景相片 */
        .folder-about .folder-bg { background-image: url('111.jpg'); }
        .folder-journey .folder-bg { background-image: url('222.jpg'); }
        .folder-collections .folder-bg { background-image: url('333.jpg'); }

        /* 文件夾疊加位置 (電腦版) */
        .folder-about { left: 10%; z-index: 10; }
        .folder-journey { left: 33%; z-index: 20; }
        .folder-collections { left: 56%; z-index: 30; }

        /* 文件夾側邊標籤 (Tabs) - 無粗體 */
        .file-tab {
            position: absolute;
            top: 40px;
            right: 0;
            width: 38px;
            height: 140px;
            background-color: #1e1d1b;
            border-radius: 0 8px 8px 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-left: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
            z-index: 5;
        }
        .file-tab span {
            writing-mode: vertical-rl;
            color: #d5c9b9;
            font-size: 0.75rem;
            letter-spacing: 3px;
            font-weight: normal; /* 移除粗體 */
            opacity: 0.7;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 封面文字排版：保留在上方，搭配頂部暗色遮罩 */
        .folder-meta {
            position: relative;
            padding: 40px;
            color: #fff;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 控制標題保留在上方 */
            z-index: 3;
            /* 改為向下的暗色漸變，保護頂部文字不被亮圖吃掉 */
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 60%);
        }
        
        .folder-meta h2 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem; /* 縮小尺寸 */
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            font-weight: normal; /* 移除粗體 */
        }

        /* 互動狀態 */
        .file-folder.pulled-out {
            transform: translate(-30px, -30px);
            box-shadow: -25px 25px 60px rgba(0, 0, 0, 0.8);
            z-index: 50;
        }

        .file-folder.opened {
            transform: translate(-80px, -30px) scale(1.15);
            opacity: 0;
            transition: all 0.4s ease-in;
        }

        /* 底部提示 */
        .info-tip {
            position: absolute;
            bottom: 30px;
            color: rgba(213,201,185,0.18);
            font-size: 0.65rem;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* ===================================================
           📱 手機端自適應排版（等比例縮減尺寸、無粗體）
           =================================================== */
        @media (max-width: 768px) {
            .brand-signature {
                top: 35px;
                left: 35px;
            }
            .brand-signature h1 {
                font-size: 1.1rem;
                letter-spacing: 3px;
            }

            .cabinet-wrapper {
                width: 100vw;
                height: 460px;
                margin-top: 60px;
            }

            .file-folder {
                width: 62vw;
                height: 100%;
            }

            .folder-about { left: 4%; }
            .folder-journey { left: 20%; }
            .folder-collections { left: 36%; }

            .file-tab {
                width: 28px;
                height: 100px;
            }
            .file-tab span {
                font-size: 0.6rem;
                letter-spacing: 1px;
            }

            .folder-about .file-tab { top: 30px; }
            .folder-journey .file-tab { top: 150px; }
            .folder-collections .file-tab { top: 270px; }

            .folder-meta { padding: 25px; }
            .folder-meta h2 { font-size: 1.1rem; }
            
            .file-folder.pulled-out {
                transform: translate(-15px, -20px);
            }
            .file-folder.opened {
                transform: translate(-30px, -20px) scale(1.05);
            }

            .info-tip {
                bottom: 20px;
                font-size: 0.55rem;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="brand-signature">
        <h1>JOL CHU</h1>
    </div>

    <div class="bg-overlay" id="overlay"></div>

    <div class="cabinet-wrapper">

        <div class="file-folder folder-about" data-link="about.html">
            <div class="folder-bg"></div>
            <div class="folder-meta">
                <h2>ABOUT ME</h2>
            </div>
            <div class="file-tab"><span>ABOUT ME</span></div>
        </div>

        <div class="file-folder folder-journey" data-link="journey.html">
            <div class="folder-bg"></div>
            <div class="folder-meta">
                <h2>MY JOURNEY</h2>
            </div>
            <div class="file-tab"><span>MY JOURNEY</span></div>
        </div>

        <div class="file-folder folder-collections" data-link="collections.html">
            <div class="folder-bg"></div>
            <div class="folder-meta">
                <h2>COLLECTIONS</h2>
            </div>
            <div class="file-tab"><span>COLLECTIONS</span></div>
        </div>

    </div>

    <div class="info-tip">CLICK ONCE TO EXTRACT // CLICK AGAIN TO OPEN</div>

    <script>
        const folders = document.querySelectorAll('.file-folder');
        const overlay = document.getElementById('overlay');
        let activeFolder = null;

        folders.forEach(folder => {
            folder.addEventListener('click', (e) => {
                e.stopPropagation();

                if (activeFolder === folder) {
                    folder.classList.add('opened');
                    const target = folder.getAttribute('data-link');
                    setTimeout(() => {
                        window.location.href = target;
                    }, 400);
                    return;
                }

                resetFolders();
                folder.classList.add('pulled-out');
                activeFolder = folder;
            });
        });

        overlay.addEventListener('click', resetFolders);

        function resetFolders() {
            folders.forEach(f => f.classList.remove('pulled-out'));
            activeFolder = null;
        }
    </script>
</body>
</html>
