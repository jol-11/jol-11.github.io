<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Archive</title>
    <style>
        /* 全局美學設定：參考 111, 222, 333 的暗色復古拼貼調性 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1917; /* 深色粗糙質感底色 */
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0); /* 微弱的數字噪點感 */
            background-size: 4px 4px;
            font-family: 'Courier New', Courier, monospace, 'PingFang TC';
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 點擊外圍復原的隱形背景遮罩 */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 文件夾櫃主容器 */
        .cabinet-wrapper {
            position: relative;
            width: 90vw;
            max-width: 800px;
            height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* 通用文件夾樣式 (側放垂直排列，疊加層次) */
        .file-folder {
            position: absolute;
            height: 100%;
            width: 320px; /* 露出側面的大面積 */
            border-radius: 4px 20px 20px 4px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s;
            cursor: pointer;
            overflow: hidden;
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        /* --- 每個文件夾的獨立拼貼藝術風格 (參考圖111, 222, 333) --- */
        
        /* 1. ABOUT ME (結構幾何與古典拼貼風) */
        .folder-about {
            background: linear-gradient(to right, #2b2a27, #3a3835);
            left: 10%;
            z-index: 10;
        }
        /* 幾何線條裝飾 (仿圖111) */
        .folder-about::after {
            content: '';
            position: absolute;
            top: 10%; left: 10%; width: 80%; height: 80%;
            border: 1px solid rgba(213, 201, 185, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 2. MY JOURNEY (數字噪點與高對比植物反差風) */
        .folder-journey {
            background: linear-gradient(to right, #1e222a, #282e3b);
            left: 35%;
            z-index: 20;
        }
        /* 縱向文字排版 (仿圖1) */
        .vertical-text {
            position: absolute;
            left: 25px;
            top: 40px;
            writing-mode: vertical-rl;
            color: #8a939e;
            font-size: 0.8rem;
            letter-spacing: 4px;
        }

        /* 3. COLLECTION (暗黑素描與雜色膠片風) */
        .folder-collection {
            background: linear-gradient(to right, #242621, #191b17);
            left: 60%;
            z-index: 30;
        }

        /* 文件夾側邊標籤 (Tabs) */
        .file-tab {
            position: absolute;
            top: 40px;
            right: -5px;
            width: 35px;
            height: 140px;
            background-color: inherit;
            border-radius: 0 10px 10px 0;
            border: 1px solid rgba(255,255,255,0.15);
            border-left: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        .file-tab span {
            writing-mode: vertical-rl;
            color: #d5c9b9;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* 封面內部排版與偽圖片拼貼 */
        .folder-meta {
            padding: 40px 50px 40px 40px;
            color: #d5c9b9;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .folder-meta h2 {
            font-size: 1.6rem;
            margin: 0;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(213,201,185,0.3);
            padding-bottom: 10px;
        }
        .code-num {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-bottom: 5px;
        }

        /* --- 核心動態效果 --- */

        /* 狀態一：點擊一次拉出 (向左靠攏並放大，凸顯選中感) */
        .file-folder.pulled-out {
            transform: translate(-40px, -20px) scale(1.03);
            box-shadow: -20px 20px 50px rgba(0, 0, 0, 0.7);
            z-index: 50; /* 確保被抽出的文件夾在最上層 */
        }

        /* 狀態二：點擊第二次打開 (優雅淡出並放大) */
        .file-folder.opened {
            transform: translate(-100px, -20px) scale(1.2);
            opacity: 0;
            transition: all 0.4s ease-in;
        }

        /* 基礎提示 */
        .info-tip {
            position: absolute;
            bottom: 30px;
            color: rgba(213,201,185,0.4);
            font-size: 0.75rem;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-overlay" id="overlay"></div>

    <div class="cabinet-wrapper">

        <div class="file-folder folder-about" data-link="about.html">
            <div class="folder-meta">
                <div>
                    <div class="code-num">CODE__001 // ARCHIVE</div>
                    <h2>ABOUT ME</h2>
                </div>
                <div style="font-size: 0.8rem; opacity: 0.6; line-height: 1.5;">
                    [ VISUAL STUDIES ]<br>TYPE : IDENTITY
                </div>
            </div>
            <div class="file-tab"><span>ABOUT ME</span></div>
        </div>

        <div class="file-folder folder-journey" data-link="journey.html">
            <div class="vertical-text">DIARY LOG : 2026_RED</div>
            <div class="folder-meta" style="align-items: flex-end; text-align: right;">
                <div>
                    <div class="code-num">CODE__002 // FALLING</div>
                    <h2>MY JOURNEY</h2>
                </div>
                <div style="font-size: 0.8rem; opacity: 0.6; width: 100%;">
                    [ TIMELINE.LOG ]
                </div>
            </div>
            <div class="file-tab" style="top: 190px;"><span>MY JOURNEY</span></div>
        </div>

        <div class="file-folder folder-collection" data-link="collection.html">
            <div class="folder-meta">
                <div>
                    <div class="code-num">CODE__003 // SIGNAL</div>
                    <h2>COLLECTION</h2>
                </div>
                <div style="font-size: 0.8rem; opacity: 0.4;">
                    /// AFTER WORK CREATIVE
                </div>
            </div>
            <div class="file-tab" style="top: 340px;"><span>COLLECTION</span></div>
        </div>

    </div>

    <div class="info-tip">CLICK ONCE TO EXTRACT / CLICK AGAIN TO OPEN</div>

    <script>
        const folders = document.querySelectorAll('.file-folder');
        const overlay = document.getElementById('overlay');
        let activeFolder = null; // 紀錄當前被抽出的文件夾

        folders.forEach(folder => {
            folder.addEventListener('click', (e) => {
                e.stopPropagation(); // 防止事件冒泡到 overlay

                // 如果點擊的是「已經被抽出」的文件夾 -> 觸發打開分頁
                if (activeFolder === folder) {
                    folder.classList.add('opened');
                    const target = folder.getAttribute('data-link');
                    setTimeout(() => {
                        window.location.href = target;
                    }, 400);
                    return;
                }

                // 如果點擊的是別的文件夾，先復原當前抽出的
                resetFolders();

                // 讓當前點擊的文件夾「抽出」
                folder.classList.add('pulled-out');
                activeFolder = folder;
            });
        });

        // 點擊背景空白處，復原所有文件夾
        overlay.addEventListener('click', resetFolders);

        function resetFolders() {
            folders.forEach(f => f.classList.remove('pulled-out'));
            activeFolder = null;
        }
    </script>
</body>
</html>
