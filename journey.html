<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Journey | Antique 3D Globe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0d0c0b; overflow: hidden; font-family: 'Courier New', monospace, 'PingFang TC'; }
        #canvas_container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .header-nav { position: absolute; top: 30px; left: 40px; z-index: 10; pointer-events: none; }
        .header-nav h1 { color: #d4c3a8; font-size: 1.8rem; letter-spacing: 5px; margin: 0; font-family: 'Times New Roman', serif; text-shadow: 2px 2px 12px rgba(0,0,0,0.9); }
        .header-nav p { color: rgba(213, 201, 185, 0.6); font-size: 0.75rem; letter-spacing: 3px; margin: 6px 0 0 0; }
        
        .back-btn { position: absolute; bottom: 40px; left: 40px; z-index: 10; color: #d5c9b9; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px; border: 1px solid rgba(213, 201, 185, 0.4); padding: 12px 24px; border-radius: 4px; background: rgba(18,17,16,0.85); backdrop-filter: blur(6px); transition: all 0.3s; }
        .back-btn:hover { background: #c5b4a0; color: #121110; }

        .custom-popup {
            position: absolute; background: rgba(25,24,22,0.96); border: 1px solid #c5b4a0; border-radius: 8px;
            padding: 18px; color: #d5c9b9; width: 210px; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            display: none; z-index: 100; font-size: 0.8rem; line-height: 1.5;
        }
        .custom-popup h3 { margin: 0 0 8px 0; color: #f0e6d2; letter-spacing: 1px; }
        .custom-popup a { display: inline-block; margin-top: 10px; background: #c5b4a0; color: #121110; padding: 8px 18px; border-radius: 4px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h1>MY JOURNEY</h1>
        <p>THE FOOTPRINTS OF TIME // ARCHIVAL GLOBE</p>
    </div>
    
    <a href="index.html" class="back-btn">← RETURN TO CABINET</a>
    <div id="canvas_container"></div>

    <div id="popup" class="custom-popup">
        <h3 id="popup_title"></h3>
        <p id="popup_desc"></p>
        <a id="popup_link" href="#">ENTER ARCHIVE</a>
    </div>

    <script>
        const container = document.getElementById('canvas_container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 光源調整（更接近老照片的柔和光）
        scene.add(new THREE.AmbientLight(0x555555, 0.9));
        const dirLight = new THREE.DirectionalLight(0xfff8e8, 1.6);
        dirLight.position.set(8, 6, 5);
        scene.add(dirLight);

        const textureLoader = new THREE.TextureLoader();

        // === 關鍵：使用更高品質的復古羊皮紙地球貼圖 ===
        const colorMap = textureLoader.load('https://i.imgur.com/8z3X9vL.jpg');  // 高解析度復古地圖（含清晰大洲標籤）
        const bumpMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');

        const geometry = new THREE.SphereGeometry(2.1, 96, 96);
        const material = new THREE.MeshStandardMaterial({
            map: colorMap,
            bumpMap: bumpMap,
            bumpScale: 0.12,
            normalScale: new THREE.Vector2(0.9, 0.9),
            roughness: 0.92,
            metalness: 0.03,
            flatShading: false
        });

        const earth = new THREE.Mesh(geometry, material);
        earth.rotation.y = Math.PI * 0.5;   // 調整初始角度讓各大洲位置更自然
        scene.add(earth);

        camera.position.set(0, 0.2, 6.5);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 4;
        controls.maxDistance = 9;

        // 正確的經緯度轉換函數
        function latLngToVector3(lat, lng, radius = 2.1) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);   // 重要修正
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // === 標記點 ===
        const markers = [];
        const pinData = [
            {
                name: "HONG KONG",
                lat: 22.3193, lng: 114.1694,
                desc: "[ HOME BASE ]<br>起始點與生活的記憶。",
                link: "journey/hongkong.html"
            },
            {
                name: "AUSTRIA",
                lat: 47.5162, lng: 14.5501,
                desc: "[ TRACK__01 ]<br>音樂、雪山與金色黃昏。",
                link: "journey/austria.html"
            }
        ];

        pinData.forEach((data, index) => {
            const pinGroup = new THREE.Group();
            
            if (data.name === "HONG KONG") {
                // 全新香港標記：古典金色八芒星 + 小底座（更優雅）
                const starGeom = new THREE.CircleGeometry(0.055, 8);
                const starMat = new THREE.MeshStandardMaterial({ color: 0xe8d070, metalness: 0.95, roughness: 0.1 });
                const star = new THREE.Mesh(starGeom, starMat);
                star.position.y = 0.08;
                star.rotation.x = Math.PI / 2;
                pinGroup.add(star);
            } else {
                // 奧地利：古典金屬圖釘
                const ball = new THREE.Mesh(
                    new THREE.SphereGeometry(0.035, 24, 24),
                    new THREE.MeshStandardMaterial({ color: 0xd4c3a8, metalness: 0.9, roughness: 0.2 })
                );
                const needle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.004, 0.004, 0.1, 8),
                    new THREE.MeshStandardMaterial({ color: 0xb8a88a })
                );
                ball.position.y = 0.09;
                needle.position.y = 0.04;
                pinGroup.add(ball, needle);
            }

            const pos = latLngToVector3(data.lat, data.lng);
            pinGroup.position.copy(pos);
            pinGroup.lookAt(0, 0, 0);
            pinGroup.rotateX(Math.PI);

            earth.add(pinGroup);
            markers.push(...pinGroup.children);
        });

        // 點擊互動
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const popup = document.getElementById('popup');

        window.addEventListener('click', (e) => {
            if (e.target.closest('#popup')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers, true);

            if (intersects.length > 0) {
                const data = intersects[0].object.parent.userData || intersects[0].object.userData;
                popup.style.display = 'block';
                popup.style.left = Math.min(e.clientX + 20, window.innerWidth - 250) + 'px';
                popup.style.top = (e.clientY - 100) + 'px';
                document.getElementById('popup_title').innerText = data.name || "LOCATION";
                document.getElementById('popup_desc').innerHTML = data.desc;
                document.getElementById('popup_link').href = data.link;
            } else {
                popup.style.display = 'none';
            }
        });

        let autoRotate = true;
        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) earth.rotation.y += 0.0006;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
