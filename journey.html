<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Journey | Archival 3D Globe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0c0b0a; font-family: 'Courier New', monospace, 'PingFang TC'; overflow: hidden; }
        #canvas_container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .header-nav { position: absolute; top: 30px; left: 40px; z-index: 10; pointer-events: none; }
        .header-nav h1 { color: #c5b4a0; font-size: 1.6rem; letter-spacing: 4px; margin: 0; font-family: 'Times New Roman', serif; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .header-nav p { color: rgba(213, 201, 185, 0.5); font-size: 0.7rem; letter-spacing: 2px; margin: 5px 0 0 0; }
        .back-btn { position: absolute; bottom: 40px; left: 40px; z-index: 10; color: #d5c9b9; text-decoration: none; font-size: 0.8rem; letter-spacing: 2px; border: 1px solid rgba(213, 201, 185, 0.3); padding: 10px 20px; border-radius: 4px; background-color: rgba(18, 17, 16, 0.8); backdrop-filter: blur(5px); transition: all 0.3s; z-index: 10; }
        .back-btn:hover { background-color: #c5b4a0; color: #121110; box-shadow: 0 0 15px rgba(197, 180, 160, 0.4); }

        /* 🔥 修正 2：不使用紅色，保持原本的高級深羊皮紙印刷色，並注入多重立體陰影與白邊襯托 */
        .globe-label {
            position: absolute;
            z-index: 5;
            transform: translate(-50%, -50%);
            color: rgba(75, 60, 45, 0.95); /* 原本的古典深羊皮紙復古色 */
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.0rem; 
            letter-spacing: 3px;
            pointer-events: none;
            /* 核心陰影優化：利用四周白邊外襯 + 右下柔和深色外陰影，確保在完全打亮的陸地上依然Scannable */
            text-shadow: 
                1px 1px 0px rgba(255, 255, 255, 0.9), 
                -1px -1px 0px rgba(255, 255, 255, 0.9),  
                1px -1px 0px rgba(255, 255, 255, 0.9),  
                -1px 1px 0px rgba(255, 255, 255, 0.9),
                2px 2px 4px rgba(0, 0, 0, 0.3);
            display: none; 
            user-select: none;
        }

        .custom-popup {
            position: absolute;
            background-color: rgba(25, 24, 22, 0.96);
            border: 1px solid rgba(197, 180, 160, 0.4);
            border-radius: 6px;
            padding: 15px;
            color: #d5c9b9;
            font-family: 'Courier New', monospace;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: none;
            z-index: 100;
            width: 190px;
        }
        .custom-popup h3 { margin: 0 0 6px 0; color: #fff; font-size: 1.1rem; letter-spacing: 1px; }
        .custom-popup p { margin: 0 0 12px 0; font-size: 0.75rem; opacity: 0.8; line-height: 1.4; }
        .custom-popup a { display: inline-block; color: #121110; background-color: #c5b4a0; text-decoration: none; font-size: 0.75rem; font-weight: bold; padding: 6px 14px; border-radius: 4px; transition: background 0.2s; }
        .custom-popup a:hover { background-color: #dfd5c6; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h1>MY JOURNEY</h1>
        <p>THE FOOTPRINTS OF TIME // ARCHIVAL GLOBE</p>
    </div>
    
    <a href="index.html" class="back-btn">← RETURN TO CABINET</a>
    <div id="canvas_container"></div>
    <div id="labels_layer"></div>

    <div id="popup" class="custom-popup">
        <h3 id="popup_title">LOCATION</h3>
        <p id="popup_desc">Description</p>
        <a id="popup_link" href="#">ENTER ARCHIVE</a>
    </div>

    <script>
        // 1. 初始化環境
        const container = document.getElementById('canvas_container');
        const labelsLayer = document.getElementById('labels_layer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 2. 【🔥 核心修正 1：取消白天黑夜，全方位 360 度打亮】
        // 顯著提升環境光，消除轉動時的暗部與黑夜效果
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.3); 
        scene.add(ambientLight);

        // 正面立體柔和光，保留羊皮紙法線地形的微弱雕刻立體感
        const frontLight = new THREE.DirectionalLight(0xfff5e6, 0.4); 
        frontLight.position.set(6, 4, 5); 
        scene.add(frontLight);

        // 背面補光，徹底抹除任何可能產生的陰影黑夜
        const backLight = new THREE.DirectionalLight(0xfff5e6, 0.4); 
        backLight.position.set(-6, -4, -5); 
        scene.add(backLight);

        // 3. 質感核心：復古「手工牛皮紙黏土浮雕」材質地球
        const textureLoader = new THREE.TextureLoader();
        const colorMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const bumpMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');

        const geometry = new THREE.SphereGeometry(2, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: colorMap,
            normalMap: bumpMap,          
            normalScale: new THREE.Vector2(1.2, 1.2), 
            color: 0xd5c9b9,              
            roughness: 0.85,              
            metalness: 0.05               
        });
        
        const earth = new THREE.Mesh(geometry, material);
        earth.rotation.y = Math.PI; 
        scene.add(earth);

        camera.position.set(0, 1.2, 6);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.5;
        controls.maxDistance = 8;

        // 5. 球面經緯度轉 3D 坐標公式
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng) * (Math.PI / 180); 
            
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi),
                -radius * Math.sin(phi) * Math.cos(theta)
            );
        }

        // --- 6. 大洲位置標籤 ---
        const continentLabels = [
            { name: "ASIA", lat: 35.0, lng: 95.0 },
            { name: "EUROPE", lat: 50.0, lng: 15.0 }, 
            { name: "AFRICA", lat: 5.0, lng: 20.0 },  
            { name: "AUSTRALIA", lat: -25.0, lng: 135.0 }, 
            { name: "INDIAN OCEAN", lat: -15.0, lng: 80.0 }, 
            { name: "PACIFIC OCEAN", lat: 20.0, lng: 150.0 } 
        ];

        continentLabels.forEach(label => {
            const el = document.createElement('div');
            el.className = 'globe-label';
            el.innerText = label.name;
            labelsLayer.appendChild(el);
            label.domElement = el;

            const anchor = new THREE.Object3D();
            anchor.position.copy(latLngToVector3(label.lat, label.lng, 2.02)); 
            earth.add(anchor);
            label.anchor = anchor;
        });

        // --- 7. 香港 Pin 點與奧地利 Pin 點 ---
        const markers = [];
        const pinData = [
            {
                name: "HONG KONG",
                lat: 22.3193, lng: 114.1694,
                isHome: true, 
                color: 0xd4af37, 
                desc: "[ HOME BASE ]<br>記憶與起點。",
                link: "journey/hongkong.html"
            },
            {
                name: "AUSTRIA",
                lat: 47.5162, lng: 14.5501,
                isHome: false, 
                color: 0xb5a38f, 
                desc: "[ TRACK__01 ]<br>音樂、雪山與金色黃昏的追尋。",
                link: "journey/austria.html"
            }
        ];

        pinData.forEach(data => {
            const pinGroup = new THREE.Group();
            
            if (data.isHome) {
                const starShape = new THREE.Shape();
                const numPoints = 5;
                const innerRadius = 0.022; 
                const outerRadius = 0.055;
                const cx = 0, cy = 0;
                
                for (let i = 0; i < numPoints * 2; i++) {
                    const radius = (i % 2 === 0) ? outerRadius : innerRadius;
                    const angle = (Math.PI * i) / numPoints;
                    const x = cx + radius * Math.sin(angle);
                    const y = cy + radius * Math.cos(angle);
                    if (i === 0) { starShape.moveTo(x, y); } else { starShape.lineTo(x, y); }
                }
                starShape.closePath();

                const extrudeSettings = { depth: 0.015, bevelEnabled: false, curveSegments: 12 };
                const starGeom = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
                const starMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
                const starMesh = new THREE.Mesh(starGeom, starMat);
                pinGroup.add(starMesh);

                const clickSphereGeom = new THREE.SphereGeometry(0.08, 16, 16);
                const clickMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.0, depthWrite: false }); 
                const clickSphere = new THREE.Mesh(clickSphereGeom, clickMat);
                clickSphere.userData = data; 
                clickSphere.name = "ClickArea_HK";
                pinGroup.add(clickSphere);
                markers.push(clickSphere); 

            } else {
                const ballGeom = new THREE.SphereGeometry(0.035, 16, 16);
                const pinGeom = new THREE.CylinderGeometry(0.006, 0.006, 0.1, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xe5d8c4, metalness: 0.85, roughness: 0.2 });
                
                const ball = new THREE.Mesh(ballGeom, mat);
                ball.position.y = 0.07;
                const pin = new THREE.Mesh(pinGeom, mat);
                pin.position.y = 0.02;
                
                pinGroup.add(ball, pin);
                pinGroup.children.forEach(child => child.userData = data); 
                markers.push(ball, pin); 
            }

            const pos = latLngToVector3(data.lat, data.lng, 2.0); 
            pinGroup.position.copy(pos);
            
            const targetPos = latLngToVector3(data.lat, data.lng, 3.0);
            pinGroup.lookAt(targetPos);
            if(!data.isHome) pinGroup.rotateX(Math.PI / 2); 

            earth.add(pinGroup);
        });

        // 7. 滑鼠點擊偵測機制
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const popup = document.getElementById('popup');

        window.addEventListener('click', (e) => {
            if (e.target.closest('#popup')) return; 

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers); 

            if (intersects.length > 0) {
                const hitPin = intersects[0].object.userData;
                
                popup.style.display = 'block';
                popup.style.left = Math.min(e.clientX + 15, window.innerWidth - 220) + 'px';
                popup.style.top = Math.min(e.clientY - 30, window.innerHeight - 150) + 'px';
                document.getElementById('popup_title').innerText = hitPin.name;
                document.getElementById('popup_desc').innerHTML = hitPin.desc;
                document.getElementById('popup_link').href = hitPin.link;
                
                autoRotate = false; 
            } else {
                popup.style.display = 'none';
                autoRotate = true; 
            }
        });

        // 8. 動態渲染與大洲投影
        let autoRotate = true;
        const tempV = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                earth.rotation.y += 0.0012; 
            }
            
            continentLabels.forEach(label => {
                label.anchor.getWorldPosition(tempV); 
                
                const distToCamera = tempV.distanceTo(camera.position);
                const earthCenterToCamera = earth.position.distanceTo(camera.position);
                
                if (distToCamera > earthCenterToCamera) {
                    label.domElement.style.display = 'none';
                } else {
                    label.domElement.style.display = 'block';
                    tempV.project(camera);
                    const x = (tempV.x * .5 + .5) * window.innerWidth;
                    const y = (-(tempV.y * .5) + .5) * window.innerHeight;
                    label.domElement.style.left = `${x}px`;
                    label.domElement.style.top = `${y}px`;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
