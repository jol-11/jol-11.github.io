<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Journey | Archival 3D Globe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0c0b0a; font-family: 'Courier New', monospace, 'PingFang TC'; overflow: hidden; }
        #canvas_container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 頂部導航與標題介面風格保持高端神祕感 */
        .header-nav { position: absolute; top: 30px; left: 40px; z-index: 10; pointer-events: none; }
        .header-nav h1 { color: #c5b4a0; font-size: 1.6rem; letter-spacing: 4px; margin: 0; font-family: 'Times New Roman', serif; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .header-nav p { color: rgba(213, 201, 185, 0.5); font-size: 0.7rem; letter-spacing: 2px; margin: 5px 0 0 0; }
        .back-btn { position: absolute; bottom: 40px; left: 40px; z-index: 10; color: #d5c9b9; text-decoration: none; font-size: 0.8rem; letter-spacing: 2px; border: 1px solid rgba(213, 201, 185, 0.3); padding: 10px 20px; border-radius: 4px; background-color: rgba(18, 17, 16, 0.8); backdrop-filter: blur(5px); transition: all 0.3s; z-index: 10; }
        .back-btn:hover { background-color: #c5b4a0; color: #121110; box-shadow: 0 0 15px rgba(197, 180, 160, 0.4); }

        /* 3D 浮空大洲名字標籤 (完美復刻 download 3 復古藝術文字感) */
        .globe-label {
            position: absolute;
            z-index: 5;
            transform: translate(-50%, -50%);
            color: rgba(90, 75, 60, 0.85); /* 高級深羊皮紙色，呈現復古印刷體感 */
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.0rem; /* 字體大小合適 */
            letter-spacing: 3px;
            pointer-events: none;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.1);
            display: none; /* 由 JS 控制顯示/隱藏 */
            user-select: none;
        }

        /* 互動彈出訊息窗美化 */
        .custom-popup {
            position: absolute;
            background-color: rgba(25, 24, 22, 0.96);
            border: 1px solid rgba(197, 180, 160, 0.4);
            border-radius: 6px;
            padding: 15px;
            color: #d5c9b9;
            font-family: 'Courier New', monospace;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: none;
            z-index: 100;
            width: 190px;
        }
        .custom-popup h3 { margin: 0 0 6px 0; color: #fff; font-size: 1.1rem; letter-spacing: 1px; }
        .custom-popup p { margin: 0 0 12px 0; font-size: 0.75rem; opacity: 0.8; line-height: 1.4; }
        .custom-popup a { display: inline-block; color: #121110; background-color: #c5b4a0; text-decoration: none; font-size: 0.75rem; font-weight: bold; padding: 6px 14px; border-radius: 4px; transition: background 0.2s; }
        .custom-popup a:hover { background-color: #dfd5c6; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h1>MY JOURNEY</h1>
        <p>THE FOOTPRINTS OF TIME // ARCHIVAL GLOBE</p>
    </div>
    
    <a href="index.html" class="back-btn">← RETURN TO CABINET</a>
    <div id="canvas_container"></div>

    <div id="labels_layer"></div>

    <div id="popup" class="custom-popup">
        <h3 id="popup_title">LOCATION</h3>
        <p id="popup_desc">Description</p>
        <a id="popup_link" href="#">ENTER ARCHIVE</a>
    </div>

    <script>
        // 1. 初始化環境
        const container = document.getElementById('canvas_container');
        const labelsLayer = document.getElementById('labels_layer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 2. 【亮度修正 1（亮度已解決，但重新調亮以便地形清晰）】
        // 增強環境光與側向主光亮度，打出高級、清晰的浮雕質感
        const ambientLight = new THREE.AmbientLight(0x777777); 
        scene.add(ambientLight);

        // 提高主側光（太陽光）亮度，打出強烈、高質感的晝夜交界光影
        const mainLight = new THREE.DirectionalLight(0xfff3e0, 2.5); 
        mainLight.position.set(6, 4, 5); // 高級舞台燈光角度，照亮亞洲與歐洲
        scene.add(mainLight);

        // 3. 質感核心：復古「手工牛皮紙黏土浮雕」材質地球
        const textureLoader = new THREE.TextureLoader();
        // 採用 100% 穩定、絕不封鎖的官方高清地貌圖與高精細法線地形圖
        const colorMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const bumpMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');

        const geometry = new THREE.SphereGeometry(2, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: colorMap,
            normalMap: bumpMap,          
            normalScale: new THREE.Vector2(1.2, 1.2), // 增強地形陰影，營造雕刻浮雕質感
            color: 0xd5c9b9,              // 【質感核心】將整顆地球渲染為復古羊皮紙色調
            roughness: 0.85,              // 完全消除塑膠反光，呈現真正的霧面紙質質感
            metalness: 0.05               
        });
        
        const earth = new THREE.Mesh(geometry, material);
        
        // 【🔥🔥 🔥 重要修正：地球儀初始對齊校正（分析地球儀）】
        // 經測試，這是針對 NASA 貼圖的精確對齊旋轉（將貼圖零點從邊緣翻轉至中心），咬合準確的公式坐標系統
        earth.rotation.y = Math.PI; 
        scene.add(earth);

        // 初始相機位置（拉遠俯瞰，對準亞歐交界中心）
        camera.position.set(0, 1.2, 6);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.5;
        controls.maxDistance = 8;

        // 5. 【🔥 核心 Bug 修正：球面經緯度轉 3D 坐標公式精確咬合校正】
        // 配合 earth.rotation.y = Math.PI，此公式經測試能將所有標記點 100% 精確釘在正確地理位置
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng) * (Math.PI / 180); // 貼圖中心已校正至 theta 零點
            
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi),
                -radius * Math.sin(phi) * Math.cos(theta)
            );
        }

        // --- 6. 【修正 3：大洲位置精確對齊校正】大洲標籤數據數據咬合精準 ---
        const continentLabels = [
            { name: "ASIA", lat: 35.0, lng: 95.0 },
            { name: "EUROPE", lat: 50.0, lng: 15.0 }, // 歐洲腹地中心
            { name: "AFRICA", lat: 5.0, lng: 20.0 },  // 非洲中部
            { name: "AUSTRALIA", lat: -25.0, lng: 135.0 }, // 澳洲內陸中心
            { name: "INDIAN OCEAN", lat: -15.0, lng: 80.0 }, // 亞非澳交界海域中心
            { name: "PACIFIC OCEAN", lat: 20.0, lng: 150.0 } // 亞美交界太平洋中心
        ];

        // 為大洲名字建立 DOM 節點並綁定 3D 錨點物件
        continentLabels.forEach(label => {
            const el = document.createElement('div');
            el.className = 'globe-label';
            el.innerText = label.name;
            labelsLayer.appendChild(el);
            label.domElement = el;

            // 在地球內部建立一個虛擬定位錨點物件，釘死入地球物件，確保 100% 同步跟隨旋轉
            const anchor = new THREE.Object3D();
            anchor.position.copy(latLngToVector3(label.lat, label.lng, 2.02)); // 稍微浮出地球表面，增加文字立體浮空感
            earth.add(anchor);
            label.anchor = anchor;
        });

        // --- 7. 【🔥修正 4：香港 Pin 點重刻（五角星 + 放大點擊區）】 ---
        const markers = [];
        const pinData = [
            {
                name: "HONG KONG",
                lat: 22.3193, lng: 114.1694,
                isHome: true, // 香港為 Home Base：金色復古五角星
                color: 0xd4af37, // 黃金色彩
                desc: "[ HOME BASE ]<br>記憶與起點。",
                link: "journey/hongkong.html"
            },
            {
                name: "AUSTRIA",
                lat: 47.5162, lng: 14.5501,
                isHome: false, // 奧地利：高端復古幾何雕刻圖釘
                color: 0xb5a38f, // 銅色復古金屬
                desc: "[ TRACK__01 ]<br>音樂、雪山與金色黃昏的追尋。",
                link: "journey/austria.html"
            }
        ];

        pinData.forEach(data => {
            const pinGroup = new THREE.Group();
            
            if (data.isHome) {
                // 【🔥重要：香港金色復古五角星重刻（ExtrudeGeometry 生成立體星星）】
                const starShape = new THREE.Shape();
                const numPoints = 5;
                const innerRadius = 0.022; // 縮小香港標記點
                const outerRadius = 0.055;
                const cx = 0, cy = 0;
                
                for (let i = 0; i < numPoints * 2; i++) {
                    const radius = (i % 2 === 0) ? outerRadius : innerRadius;
                    const angle = (Math.PI * i) / numPoints;
                    const x = cx + radius * Math.sin(angle);
                    const y = cy + radius * Math.cos(angle);
                    if (i === 0) { starShape.moveTo(x, y); } else { starShape.lineTo(x, y); }
                }
                starShape.closePath();

                const extrudeSettings = { depth: 0.015, bevelEnabled: false, curveSegments: 12 };
                const starGeom = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
                const starMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
                const starMesh = new THREE.Mesh(starGeom, starMat);
                starMesh.children.forEach(child => child.userData = data); // 綁定點擊數據
                pinGroup.add(starMesh);

                // 【🔥重要：解決互動 Bug：在星星周圍添加隱形（透明）的較大圓球作為點擊捕捉區】
                const clickSphereGeom = new THREE.SphereGeometry(0.08, 16, 16);
                const clickMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.0, depthWrite: false }); // 完全隱形
                const clickSphere = new THREE.Mesh(clickSphereGeom, clickMat);
                clickSphere.userData = data; // 綁定點擊數據！
                clickSphere.name = "ClickArea_HK";
                pinGroup.add(clickSphere);
                markers.push(clickSphere); // RAYCASTER 掃描隱形圓球，而非變小的星星！徹底解決互動 Bug

            } else {
                // 奧地利：幾何復古雕刻圖釘 (球體 + 底針)
                const ballGeom = new THREE.SphereGeometry(0.035, 16, 16);
                const pinGeom = new THREE.CylinderGeometry(0.006, 0.006, 0.1, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xe5d8c4, metalness: 0.85, roughness: 0.2 });
                
                const ball = new THREE.Mesh(ballGeom, mat);
                ball.position.y = 0.07;
                const pin = new THREE.Mesh(pinGeom, mat);
                pin.position.y = 0.02;
                
                pinGroup.add(ball, pin);
                pinGroup.children.forEach(child => child.userData = data); // 綁定點擊數據
                markers.push(ball, pin); // RAYCASTER 掃描實體
            }

            // 利用全新修正公式取得精準 3D 位置
            const pos = latLngToVector3(data.lat, data.lng, 2.0); 
            pinGroup.position.copy(pos);
            
            // 修正朝向：讓 Pin 點的頭朝向地球正上方外側射出
            const targetPos = latLngToVector3(data.lat, data.lng, 3.0);
            pinGroup.lookAt(targetPos);
            if(!data.isHome) pinGroup.rotateX(Math.PI / 2); // 校正 Three.js 錐體旋轉軸

            // 【重要】釘死入地球物件！確保隨地球絲滑轉動，絕對不偏移錯位！
            earth.add(pinGroup);
        });

        // 7. 滑鼠點擊偵測機制
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const popup = document.getElementById('popup');

        window.addEventListener('click', (e) => {
            if (e.target.closest('#popup')) return; // 點擊彈出窗本身不觸發 Raycaster

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers); // RAYCASTER 掃描 Pin 點實體和隱形點擊點

            if (intersects.length > 0) {
                // 取得userData中儲存的點擊地點資料
                const hitPin = intersects[0].object.userData;
                
                popup.style.display = 'block';
                popup.style.left = Math.min(e.clientX + 15, window.innerWidth - 220) + 'px';
                popup.style.top = Math.min(e.clientY - 30, window.innerHeight - 150) + 'px';
                document.getElementById('popup_title').innerText = hitPin.name;
                document.getElementById('popup_desc').innerHTML = hitPin.desc;
                document.getElementById('popup_link').href = hitPin.link;
                
                autoRotate = false; // 點擊時暫停自轉
            } else {
                popup.style.display = 'none';
                autoRotate = true; // 點擊空白處恢復自轉
            }
        });

        // 8. 動態渲染與浮空大洲字體二維投影計算循環
        let autoRotate = true;
        const tempV = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                earth.rotation.y += 0.0012; // 地球絲滑慢速優雅自轉
            }
            
            // 更新大洲名字標籤位置與背面裁切顯示邏輯
            continentLabels.forEach(label => {
                label.anchor.getWorldPosition(tempV); // 取得旋轉後的最新 3D 世界坐標位置
                
                // 數學核心裁切邏輯：計算標籤點到相機的距離 vs 地球中心到相機的距離
                const distToCamera = tempV.distanceTo(camera.position);
                const earthCenterToCamera = earth.position.distanceTo(camera.position);
                
                // 如果標籤點轉到地球背面，自然隱藏不穿透顯示，呈现完美藝術裁切感
                if (distToCamera > earthCenterToCamera) {
                    label.domElement.style.display = 'none';
                } else {
                    label.domElement.style.display = 'block';
                    // 將 3D 空間坐標投影轉換為網格像素的 X, Y 坐標
                    tempV.project(camera);
                    const x = (tempV.x * .5 + .5) * window.innerWidth;
                    const y = (-(tempV.y * .5) + .5) * window.innerHeight;
                    label.domElement.style.left = `${x}px`;
                    label.domElement.style.top = `${y}px`;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 視窗自適應縮放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
