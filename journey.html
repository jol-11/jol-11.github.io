<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Journey | 3D Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.31.0/dist/globe.gl.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0d0c0b;
            font-family: 'Courier New', Courier, monospace, 'PingFang TC';
            overflow: hidden;
            color: #d5c9b9;
        }

        #globe-container {
            width: 100vw;
            height: 100vh;
        }

        .header-nav {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
        }
        .header-nav h1 {
            color: #c5b4a0;
            font-size: 1.85rem;
            letter-spacing: 6px;
            margin: 0;
            font-family: 'Times New Roman', serif;
            text-shadow: 0 0 15px rgba(0,0,0,0.9);
        }
        .header-nav p {
            color: rgba(213, 201, 185, 0.6);
            font-size: 0.75rem;
            letter-spacing: 3px;
            margin-top: 6px;
        }

        .back-btn {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            color: #d5c9b9;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(213, 201, 185, 0.4);
            padding: 12px 24px;
            border-radius: 4px;
            background-color: rgba(18, 17, 16, 0.85);
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }
        .back-btn:hover {
            background-color: #c5b4a0;
            color: #121110;
            transform: translateY(-2px);
        }

        /* 自訂彈出視窗 */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(13, 12, 11, 0.95);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1e1d1b;
            border: 1px solid #c5b4a0;
            border-radius: 8px;
            width: 90%;
            max-width: 620px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .modal-content h2 {
            color: #c5b4a0;
            letter-spacing: 2px;
            margin-top: 0;
        }
        .close-btn {
            float: right;
            font-size: 1.8rem;
            color: #c5b4a0;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <h1>MY JOURNEY</h1>
        <p>TRACING THE FOOTPRINTS OF TIME</p>
    </div>

    <a href="index.html" class="back-btn">← RETURN TO CABINET</a>
    
    <div id="globe-container"></div>

    <!-- 彈出視窗 -->
    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // 初始化 Globe.GL
        const globe = new Globe(document.getElementById('globe-container'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#c5b4a0')
            .atmosphereAltitude(0.25)
            .pointAltitude(0.1)
            .pointRadius(0.6)
            .onPointClick(d => showModal(d));

        // 初始視角（偏向亞洲）
        globe.pointOfView({ lat: 25, lng: 110, altitude: 2.8 }, 2000);

        // 自動旋轉
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.35;

        // 旅行資料（之後可改成外部 JSON）
        const journeyData = [
            {
                lat: 22.3193,
                lng: 114.1694,
                name: "HONG KONG",
                type: "home",
                emoji: "⭐",
                subtitle: "HOME BASE",
                desc: "我的起點、記憶與根源。",
                link: "journey/hongkong.html"
            },
            {
                lat: 47.5162,
                lng: 14.5501,
                name: "AUSTRIA",
                type: "place",
                emoji: "📍",
                subtitle: "TRACK__01",
                desc: "雪山、古典音樂與金色黃昏。",
                link: "journey/austria.html"
            }
        ];

        // 渲染點
        globe.pointsData(journeyData)
            .pointColor(d => d.type === 'home' ? '#ffd700' : '#ff5e5e')
            .pointLabel(d => `
                <div style="color:${d.type==='home'?'#ffd700':'#ffccaa'}; font-size:13px; text-shadow: 0 0 6px black;">
                    ${d.emoji} <strong>${d.name}</strong>
                </div>
            `)
            .pointLabelAltitude(0.12);

        // 顯示彈出視窗
        function showModal(d) {
            document.getElementById('modal-body').innerHTML = `
                <h2>${d.emoji} ${d.name}</h2>
                <p style="color:#c5b4a0; font-size:1.1rem; margin:8px 0 20px 0;">${d.subtitle}</p>
                <p>${d.desc}</p>
                
                <div style="margin: 25px 0; padding: 18px; background: rgba(0,0,0,0.3); border-radius: 6px;">
                    <small>這裡之後會放相片、旅行日記、作品集…</small>
                </div>
                
                <a href="${d.link}" 
                   style="display:inline-block; background:#c5b4a0; color:#121110; padding:12px 28px; border-radius:4px; text-decoration:none; font-weight:bold; letter-spacing:1px;">
                    ENTER ARCHIVE →
                </a>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('modal').style.display = 'none';
        };

        // 點擊空白處關閉 modal
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
