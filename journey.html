<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Journey | Archival 3D Globe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0c0b0a; font-family: 'Courier New', monospace, 'PingFang TC'; overflow: hidden; }
        #canvas_container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .header-nav { position: absolute; top: 30px; left: 40px; z-index: 10; pointer-events: none; }
        .header-nav h1 { color: #c5b4a0; font-size: 1.6rem; letter-spacing: 4px; margin: 0; font-family: 'Times New Roman', serif; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .header-nav p { color: rgba(213, 201, 185, 0.5); font-size: 0.7rem; letter-spacing: 2px; margin: 5px 0 0 0; }
        .back-btn { position: absolute; bottom: 40px; left: 40px; z-index: 10; color: #d5c9b9; text-decoration: none; font-size: 0.8rem; letter-spacing: 2px; border: 1px solid rgba(213, 201, 185, 0.3); padding: 10px 20px; border-radius: 4px; background-color: rgba(18, 17, 16, 0.8); backdrop-filter: blur(5px); transition: all 0.3s; }
        .back-btn:hover { background-color: #c5b4a0; color: #121110; box-shadow: 0 0 15px rgba(197, 180, 160, 0.4); }

        /* 🔥 修正 4：換上更明顯的古典紅墨水色，既融入羊皮紙風格又能清晰與陸地區分 */
        .globe-label {
            position: absolute;
            z-index: 5;
            transform: translate(-50%, -50%);
            color: rgba(139, 35, 35, 0.95); /* 古典學院風深朱紅墨水色 */
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.0rem;
            letter-spacing: 4px;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6); /* 增加微弱的亮邊底襯，確保在任何地形上都清晰 */
            display: none;
            user-select: none;
        }

        .custom-popup {
            position: absolute;
            background-color: rgba(25, 24, 22, 0.96);
            border: 1px solid rgba(197, 180, 160, 0.4);
            border-radius: 6px;
            padding: 15px;
            color: #d5c9b9;
            font-family: 'Courier New', monospace;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: none;
            z-index: 100;
            width: 190px;
        }
        .custom-popup h3 { margin: 0 0 6px 0; color: #fff; font-size: 1.1rem; }
        .custom-popup p { margin: 0 0 12px 0; font-size: 0.75rem; opacity: 0.8; line-height: 1.4; }
        .custom-popup a { display: inline-block; color: #121110; background-color: #c5b4a0; text-decoration: none; font-size: 0.75rem; font-weight: bold; padding: 6px 14px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h1>MY JOURNEY</h1>
        <p>THE FOOTPRINTS OF TIME // ARCHIVAL GLOBE</p>
    </div>
    
    <a href="index.html" class="back-btn">← RETURN TO CABINET</a>
    <div id="canvas_container"></div>
    <div id="labels_layer"></div>

    <div id="popup" class="custom-popup">
        <h3 id="popup_title">LOCATION</h3>
        <p id="popup_desc">Description</p>
        <a id="popup_link" href="#">ENTER ARCHIVE</a>
    </div>

    <script>
        // =========================================================================
        // 🗺️ 🔥 【核心自定義配置區】：以後你加點、改大洲，直接改下面這兩個陣列即可！
        // =========================================================================
        
        // 1. 你的足跡點數據（手動增加任何地方，只需照格式複製一行，填入精確的經緯度即可）
        const MY_TRAVEL_PINS = [
            {
                name: "HONG KONG",
                lat: 22.3193, lng: 114.1694,
                isHome: true, // true 會自動生成復古五角星
                desc: "[ HOME BASE ]<br>記憶與起點。",
                link: "journey/hongkong.html"
            },
            {
                name: "AUSTRIA",
                lat: 47.5162, lng: 14.5501,
                isHome: false, // false 會自動生成復古幾何圖釘
                desc: "[ TRACK__01 ]<br>音樂、雪山與金色黃昏的記錄。",
                link: "journey/austria.html"
            }
            // 💡 未來想加新地方？直接在下面複製貼上格式即可：
            // ,{ name: "JAPAN", lat: 35.6762, lng: 139.6503, isHome: false, desc: "東京之旅", link: "journey/tokyo.html" }
        ];

        // 2. 大洲大洋標籤數據
        const CONTINENT_LABELS = [
            { name: "ASIA", lat: 45.0, lng: 95.0 },
            { name: "EUROPE", lat: 53.0, lng: 20.0 },
            { name: "AFRICA", lat: 5.0, lng: 20.0 },
            { name: "AUSTRALIA", lat: -25.0, lng: 133.0 },
            { name: "INDIAN OCEAN", lat: -15.0, lng: 80.0 },
            { name: "PACIFIC OCEAN", lat: 20.0, lng: 165.0 }
        ];

        // 3. 地球儀貼圖絕對校正補償角（單位：度）
        // 針對標準 Three.js 球體幾何面展開與 NASA 貼圖的經度偏移量進行像素級校正
        const MAP_ALIGN_OFFSET = -90; 

        // =========================================================================

        // 初始化環境
        const container = document.getElementById('canvas_container');
        const labelsLayer = document.getElementById('labels_layer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 🔥 修正 2：徹底取消白天黑夜！使用多光源 360 度無死角環繞打亮，確保所有地方都是亮的
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4); // 大幅提高環境光，亮起來！
        scene.add(ambientLight);

        const frontLight = new THREE.DirectionalLight(0xfff5e6, 0.6); // 柔和正面光，保留精緻的微弱浮雕陰影
        frontLight.position.set(5, 3, 5);
        scene.add(frontLight);

        const backLight = new THREE.DirectionalLight(0xfff5e6, 0.5); // 背面補光，消除轉到背面時的黑暗黑夜
        backLight.position.set(-5, -3, -5);
        scene.add(backLight);

        // 材質加載
        const textureLoader = new THREE.TextureLoader();
        const colorMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const bumpMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');

        const geometry = new THREE.SphereGeometry(2, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: colorMap,
            normalMap: bumpMap,          
            normalScale: new THREE.Vector2(1.1, 1.1), 
            color: 0xd5c9b9,              // 復古羊皮紙色調
            roughness: 0.8,              
            metalness: 0.05               
        });
        
        const earth = new THREE.Mesh(geometry, material);
        // 重設為標準 0 點，不進行混淆的矩陣變換
        earth.rotation.set(0, 0, 0);
        scene.add(earth);

        camera.position.set(0, 1.0, 6);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.5;
        controls.maxDistance = 8;

        // 🔥 修正 3：分析特定地球儀後，重新推導的絕對咬合幾何坐標轉換公式
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            // 引入 MAP_ALIGN_OFFSET，將經度與地圖圖像像素精確對齊，香港與奧地利絕不再漂移！
            const theta = (lng + 180 + MAP_ALIGN_OFFSET) * (Math.PI / 180); 
            
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi),
                -radius * Math.sin(phi) * Math.cos(theta)
            );
        }

        // 生成大洲標籤
        CONTINENT_LABELS.forEach(label => {
            const el = document.createElement('div');
            el.className = 'globe-label';
            el.innerText = label.name;
            labelsLayer.appendChild(el);
            label.domElement = el;

            const anchor = new THREE.Object3D();
            anchor.position.copy(latLngToVector3(label.lat, label.lng, 2.02)); 
            earth.add(anchor);
            label.anchor = anchor;
        });

        // 生成 3D 實體標記點與隱形點擊盒
        const markers = [];

        // 立體復古五角星生成函數
        function createExtrudedStar(size) {
            const shape = new THREE.Shape();
            const numPoints = 5;
            const innerRadius = size * 0.4;
            const outerRadius = size;
            for (let i = 0; i < numPoints * 2; i++) {
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                const angle = (Math.PI * i) / numPoints;
                shape.lineTo(Math.sin(angle) * r, Math.cos(angle) * r);
            }
            shape.closePath();
            const settings = { depth: 0.015, bevelEnabled: false };
            return new THREE.ExtrudeGeometry(shape, settings);
        }

        MY_TRAVEL_PINS.forEach(data => {
            const pinGroup = new THREE.Group();
            
            if (data.isHome) {
                // 香港：精準雕刻的縮小版立體復古金屬五角星 (修正 1)
                const starGeom = createExtrudedStar(0.045);
                const starMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.2 });
                const starMesh = new THREE.Mesh(starGeom, starMat);
                starMesh.rotateX(-Math.PI / 2); // 讓五角星平貼在球面上發射
                pinGroup.add(starMesh);
            } else {
                // 奧地利等足跡點：古典雕刻圖釘
                const ballGeom = new THREE.SphereGeometry(0.03, 16, 16);
                const pinGeom = new THREE.CylinderGeometry(0.005, 0.005, 0.07, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xb5a38f, metalness: 0.8, roughness: 0.2 });
                const ball = new THREE.Mesh(ballGeom, mat); ball.position.y = 0.05;
                const pin = new THREE.Mesh(pinGeom, mat); pin.position.y = 0.015;
                pinGroup.add(ball, pin);
            }

            // 🔥 修正 3 (續)：為每個 Pin 點自動生成一個「較大的隱形點擊感應球」，徹底解決縮小後點不到的分頁 Bug！
            const clickSphereGeom = new THREE.SphereGeometry(0.09, 16, 16); // 感應範圍足夠大
            const clickSphereMat = new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.0, depthWrite: false }); // 完全透明
            const clickSphere = new THREE.Mesh(clickSphereGeom, clickSphereMat);
            clickSphere.userData = data; // 將點擊數據和跳轉網址綁定在隱形球上
            pinGroup.add(clickSphere);
            markers.push(clickSphere); // 讓 Raycaster 只去掃描這個大感應球

            // 位置與朝向校正
            const pos = latLngToVector3(data.lat, data.lng, 2.0); 
            pinGroup.position.copy(pos);
            const targetPos = latLngToVector3(data.lat, data.lng, 3.0);
            pinGroup.lookAt(targetPos);
            if(!data.isHome) pinGroup.rotateX(Math.PI / 2); 

            earth.add(pinGroup);
        });

        // 滑鼠點擊互動偵測
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const popup = document.getElementById('popup');

        window.addEventListener('click', (e) => {
            if (e.target.closest('#popup')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers); // 掃描透明感應球

            if (intersects.length > 0) {
                const hitPin = intersects[0].object.userData; // 順利拿到數據！
                popup.style.display = 'block';
                popup.style.left = Math.min(e.clientX + 15, window.innerWidth - 220) + 'px';
                popup.style.top = Math.min(e.clientY - 30, window.innerHeight - 150) + 'px';
                document.getElementById('popup_title').innerText = hitPin.name;
                document.getElementById('popup_desc').innerHTML = hitPin.desc;
                document.getElementById('popup_link').href = hitPin.link;
                autoRotate = false;
            } else {
                popup.style.display = 'none';
                autoRotate = true;
            }
        });

        // 動態渲染循環
        let autoRotate = true;
        const tempV = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                earth.rotation.y += 0.0012; // 慢速優雅自轉
            }
            
            // 更新大洲名字標籤位置與背面裁切
            CONTINENT_LABELS.forEach(label => {
                label.anchor.getWorldPosition(tempV);
                const distToCamera = tempV.distanceTo(camera.position);
                const earthCenterToCamera = earth.position.distanceTo(camera.position);
                
                if (distToCamera > earthCenterToCamera) {
                    label.domElement.style.display = 'none';
                } else {
                    label.domElement.style.display = 'block';
                    tempV.project(camera);
                    const x = (tempV.x * .5 + .5) * window.innerWidth;
                    const y = (-(tempV.y * .5) + .5) * window.innerHeight;
                    label.domElement.style.left = `${x}px`;
                    label.domElement.style.top = `${y}px`;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
