<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOL's Journey | Archival 3D Globe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0b0a;
            font-family: 'Courier New', monospace, 'PingFang TC';
            overflow: hidden;
        }
        #canvas_container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .header-nav {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
        }
        .header-nav h1 {
            color: #c5b4a0;
            font-size: 1.6rem;
            letter-spacing: 4px;
            margin: 0;
            font-family: 'Times New Roman', serif;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .header-nav p {
            color: rgba(213, 201, 185, 0.5);
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin: 5px 0 0 0;
        }
        .back-btn {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            color: #d5c9b9;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border: 1px solid rgba(213, 201, 185, 0.3);
            padding: 10px 20px;
            border-radius: 4px;
            background-color: rgba(18, 17, 16, 0.8);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .back-btn:hover {
            background-color: #c5b4a0;
            color: #121110;
            box-shadow: 0 0 15px rgba(197, 180, 160, 0.4);
        }
        .globe-label {
            position: absolute;
            z-index: 5;
            transform: translate(-50%, -50%);
            color: rgba(175, 160, 142, 0.75);
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.0rem;
            letter-spacing: 3px;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            display: none;
            user-select: none;
        }
        .custom-popup {
            position: absolute;
            background-color: rgba(25, 24, 22, 0.96);
            border: 1px solid rgba(197, 180, 160, 0.4);
            border-radius: 6px;
            padding: 15px;
            color: #d5c9b9;
            font-family: 'Courier New', monospace;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: none;
            z-index: 100;
            width: 210px;
        }
        .custom-popup h3 { margin: 0 0 6px 0; color: #fff; font-size: 1.1rem; letter-spacing: 1px; }
        .custom-popup p { margin: 0 0 12px 0; font-size: 0.75rem; opacity: 0.8; line-height: 1.4; }
        .custom-popup a {
            display: inline-block;
            color: #121110;
            background-color: #c5b4a0;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .custom-popup a:hover { background-color: #dfd5c6; }
    </style>
</head>
<body>
    <div class="header-nav">
        <h1>MY JOURNEY</h1>
        <p>ARCHIVAL GLOBE</p>
    </div>
    <a href="index.html" class="back-btn">← RETURN TO CABINET</a>
    <div id="canvas_container"></div>
    <div id="labels_layer"></div>
    <div id="popup" class="custom-popup">
        <h3 id="popup_title">LOCATION</h3>
        <p id="popup_desc">Description</p>
        <a id="popup_link" href="#">ENTER ARCHIVE</a>
    </div>
    <script>
        const container = document.getElementById('canvas_container');
        const labelsLayer = document.getElementById('labels_layer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.3));
        const frontLight = new THREE.DirectionalLight(0xfff5e6, 0.4); frontLight.position.set(6,4,5); scene.add(frontLight);
        const backLight = new THREE.DirectionalLight(0xfff5e6, 0.4); backLight.position.set(-6,-4,-5); scene.add(backLight);
        const textureLoader = new THREE.TextureLoader();
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(2, 64, 64),
            new THREE.MeshStandardMaterial({
                map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'),
                normalMap: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg'),
                normalScale: new THREE.Vector2(1.2, 1.2),
                color: 0xd5c9b9,
                roughness: 0.85,
                metalness: 0.05
            })
        );
        scene.add(earth);
        camera.position.set(0, 1.2, 6);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.5;
        controls.maxDistance = 8;
        const lngOffset = -136;
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + lngOffset) * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi),
                -radius * Math.sin(phi) * Math.cos(theta)
            );
        }
        const continentLabels = [
            { name: "ASIA", lat: 40.0, lng: 140.0 },
            { name: "EUROPE", lat: 55.0, lng: 185.0 },
            { name: "AFRICA", lat: 8.0, lng: 200.0 },
            { name: "AUSTRALIA", lat: -25.0, lng: 90.0 },
            { name: "INDIAN OCEAN", lat: -10.0, lng: 150.0 },
            { name: "NORTH AMERICA", lat: 38, lng: 325.0 },
            { name: "SOUTH AMERICA", lat: -15.0, lng: 280.0 },
            { name: "ANTARCTICA", lat: -88.0, lng: 280.0 },
            { name: "ATLANTIC OCEAN", lat: 22, lng: 270.0 },
            { name: "ARCTIC OCEAN", lat: 62, lng: 260.0 },
            { name: "PACIFIC OCEAN", lat: 17.0, lng: 35.0 }
        ];
        continentLabels.forEach(label => {
            const el = document.createElement('div');
            el.className = 'globe-label';
            el.innerText = label.name;
            labelsLayer.appendChild(el);
            label.domElement = el;
            const anchor = new THREE.Object3D();
            anchor.position.copy(latLngToVector3(label.lat, label.lng, 2.02));
            earth.add(anchor);
            label.anchor = anchor;
        });
        const markers = [];
        const pinData = [
            { name: "HONG KONG", lat: 22.4, lng: 110.8, isHome: true, desc: "[ HOME BASE ]<br>起點", link: "journey/hongkong.html" },
            { name: "AUSTRIA", lat: 47, lng: 211, isHome: false, desc: "[ TRACK__01 ]<br>音樂、雪山與金色黃昏", link: "journey/austria.html" },
            { name: "ICELAND", lat: 65, lng: 243.7, isHome: false, desc: "[ TRACK__02 ]<br>白色的夢", link: "journey/iceland.html" },
            { name: "SWITZERLAND", lat: 47.48, lng: 216.7, isHome: false, desc: "[ TRACK__03 ]<br>阿爾卑斯山", link: "journey/switzerland.html" },
            { name: "SAN FRANCISCO", lat: 37.8, lng:-12, isHome: false, desc: "[ TRACK__04 ]<br>SF", link: "journey/sanfrancisco.html" }
        ];
        pinData.forEach(data => {
            const pinGroup = new THREE.Group();
            if (data.isHome) {
                const starShape = new THREE.Shape();
                const numPoints = 5;
                const innerRadius = 0.022;
                const outerRadius = 0.055;
                for (let i = 0; i < numPoints * 2; i++) {
                    const radius = (i % 2 === 0) ? outerRadius : innerRadius;
                    const angle = (Math.PI * i) / numPoints;
                    const x = radius * Math.sin(angle);
                    const y = radius * Math.cos(angle);
                    if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
                }
                starShape.closePath();
                const starGeom = new THREE.ExtrudeGeometry(starShape, { depth: 0.015, bevelEnabled: false });
                const starMat = new THREE.MeshBasicMaterial({ color: 0xffea80 });
                pinGroup.add(new THREE.Mesh(starGeom, starMat));
                const clickSphere = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ transparent: true, opacity: 0 }));
                clickSphere.userData = data;
                pinGroup.add(clickSphere);
                markers.push(clickSphere);
            } else {
                const mat = new THREE.MeshStandardMaterial({ color: 0xff7a5c, metalness: 0.8, roughness: 0.2 });
                const ball = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), mat);
                ball.position.y = 0.07;
                const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.1, 8), mat);
                pin.position.y = 0.02;
                pinGroup.add(ball, pin);
                pinGroup.children.forEach(child => child.userData = data);
                markers.push(ball, pin);
            }
            const pos = latLngToVector3(data.lat, data.lng, 2.0);
            pinGroup.position.copy(pos);
            const targetPos = latLngToVector3(data.lat, data.lng, 3.0);
            pinGroup.lookAt(targetPos);
            if (!data.isHome) pinGroup.rotateX(Math.PI / 2);
            earth.add(pinGroup);
        });
        // ==================== 手機 + 電腦通用點擊處理 ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const popup = document.getElementById('popup');
        function handleInteraction(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers, true);
            if (intersects.length > 0) {
                const hit = intersects[0].object.userData;
                popup.style.display = 'block';
                popup.style.left = Math.min(clientX + 15, window.innerWidth - 220) + 'px';
                popup.style.top = Math.min(clientY - 40, window.innerHeight - 160) + 'px';
                document.getElementById('popup_title').innerText = hit.name;
                document.getElementById('popup_desc').innerHTML = hit.desc;
                document.getElementById('popup_link').href = hit.link;
                autoRotate = false;
            } else {
                popup.style.display = 'none';
                autoRotate = true;
            }
        }
        window.addEventListener('click', (e) => {
            if (e.target.closest('#popup')) return;
            handleInteraction(e.clientX, e.clientY);
        });
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 0) return;
            if (e.target.closest('#popup')) return;
            const t = e.changedTouches[0];
            handleInteraction(t.clientX, t.clientY);
        });
        let autoRotate = true;
        const tempV = new THREE.Vector3();
        controls.addEventListener('start', () => autoRotate = false);
        controls.addEventListener('end', () => autoRotate = true);
        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) earth.rotation.y += 0.0012;
            continentLabels.forEach(label => {
                label.anchor.getWorldPosition(tempV);
                const distToCamera = tempV.distanceTo(camera.position);
                const earthCenterToCamera = earth.position.distanceTo(camera.position);
                if (distToCamera > earthCenterToCamera) {
                    label.domElement.style.display = 'none';
                } else {
                    label.domElement.style.display = 'block';
                    tempV.project(camera);
                    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;
                    label.domElement.style.left = `${x}px`;
                    label.domElement.style.top = `${y}px`;
                }
            });
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
